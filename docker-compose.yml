services:
  postgres:
    image: postgres:16-alpine
    container_name: pop-postgres
    environment:
      POSTGRES_USER: pop_user
      POSTGRES_PASSWORD: pop_password
      POSTGRES_DB: pop_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pop_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pop-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pop_user:pop_password@postgres:5432/pop_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_12345}
    ports:
      - "3000:3000"
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pop-frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: